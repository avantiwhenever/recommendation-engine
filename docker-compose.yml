services:
  pinecone-local:
    # In-memory Pinecone emulator — no account, no API key, no persistence.
    # x86_64-only image (verified: no multi-arch manifest), so `platform` is
    # pinned explicitly rather than left to auto-detection, which would fail
    # outright on Apple Silicon instead of falling back.
    image: ghcr.io/pinecone-io/pinecone-local:latest
    platform: linux/amd64
    environment:
      PORT: 5080
      PINECONE_HOST: pinecone-local
    ports:
      - "5080-5090:5080-5090"
    # No healthcheck: the image is a scratch/distroless-style single binary
    # with no shell, so a CMD-based healthcheck can't run inside it. Plain
    # `depends_on` below only waits for container start, not readiness —
    # search-service's and recommender-service's Pinecone clients retry their
    # first connection with backoff to cover the few-second startup gap.

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    environment:
      PINECONE_HOST: http://pinecone-local:5080
      PINECONE_API_KEY: pclocal
      PINECONE_TLS_ENABLED: "false"
      PINECONE_INDEX: wands-products
      SEARCH_MODELS_EMBEDDING_DIR: /models/bge-small-en-v1.5
      GRPC_PORT: 9090
    volumes:
      - ./models:/models:ro
      # Only the ingestion CLI (run via `docker compose run`) reads this —
      # the served application itself never touches the raw CSVs.
      - ./data:/data:ro
    ports:
      - "9090:9090"
    depends_on:
      - pinecone-local

  recommender-service:
    build:
      context: .
      dockerfile: recommender-service/Dockerfile
    environment:
      # No Pinecone dependency: none of the shipped strategies need
      # per-candidate vector similarity (NeuralRankingStrategy uses a
      # category-match proxy instead — see its class Javadoc), so
      # recommender-service only needs the clickstream + catalog CSVs.
      CLICKSTREAM_DATA_PATH: /data/clickstream.csv
      PRODUCT_CATALOG_PATH: /data/product.csv
      NEURAL_RANKER_MODEL_PATH: /models/neural-ranker/model.onnx
      GRPC_PORT: 9091
    volumes:
      - ./data:/data:ro
      - ./models:/models:ro
    ports:
      - "9091:9091"
    depends_on:
      - pinecone-local

  graphql-gateway:
    build:
      context: .
      dockerfile: graphql-gateway/Dockerfile
    environment:
      SEARCH_SERVICE_HOST: search-service
      SEARCH_SERVICE_GRPC_PORT: 9090
      RECOMMENDER_SERVICE_HOST: recommender-service
      RECOMMENDER_SERVICE_GRPC_PORT: 9091
      SERVER_PORT: 8080
      # Must match WEB_HOST_PORT below — the browser calls this gateway
      # cross-origin from the frontend's own host port, so CORS has to know
      # exactly which origin to allow.
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-5173}
    ports:
      # Overridable so this stack can run alongside another project already
      # bound to 8080 on the host, e.g. `GATEWAY_HOST_PORT=18080 docker compose up`.
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - search-service
      - recommender-service

  web:
    build:
      context: ./web
      # Vite env vars are baked in at build time, not read at container
      # runtime — a plain `environment:` entry here would have no effect on
      # the already-built static bundle nginx serves, so this must be a
      # build arg instead.
      args:
        # Must match GATEWAY_HOST_PORT above — baked into the static bundle
        # at build time, so the frontend and gateway ports have to be
        # decided together, not just at `up` time.
        VITE_GRAPHQL_URL: http://localhost:${GATEWAY_HOST_PORT:-8080}/graphql
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    depends_on:
      - graphql-gateway
