syntax = "proto3";

package recengine.recommender.v1;

import "search_service.proto";

option java_package = "com.avanti.recengine.grpc.recommender";
option java_multiple_files = true;

// The only contract recommender-service exposes.
service RecommenderService {
  rpc Recommend (RecommendRequest) returns (RecommendResponse);
}

enum Strategy {
  NONE = 0;
  POPULARITY = 1;
  COLLABORATIVE = 2;
  BANDIT = 3;
  NEURAL = 4;
  // Popularity, then an MMR-style diversity re-rank on top (see
  // recommender-service's DiversityAwareStrategy) — a decorator over an
  // existing strategy, not a from-scratch retrieval technique.
  DIVERSE_POPULARITY = 5;
}

message RecommendRequest {
  string query = 1;
  string user_id = 2;
  Strategy strategy = 3;
  // Baseline candidates from search-service, reusing its message type
  // directly rather than re-declaring an equivalent one.
  repeated recengine.search.v1.ScoredProduct candidates = 4;
  // Product IDs the user interacted with in the *current* browsing session,
  // distinct from their all-time clickstream history (ClickstreamRepositoryPort).
  // Optional — an empty list means "no session signal available," not "new
  // user" (a genuinely new user also has an empty ClickstreamRepositoryPort
  // profile; see CollaborativeFilteringStrategy's cold-start branch).
  repeated string recent_product_ids = 5;
}

message RecommendResponse {
  repeated recengine.search.v1.ScoredProduct results = 1;
  // Which strategy produced (or boosted/injected) each result — surfaced to
  // the frontend as the result's "why was this shown" badge.
  string source = 2;
}
